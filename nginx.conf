events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Add a Content Security Policy to enhance security and prevent XSS attacks.
        # 'self' allows content from the same origin.
        # 'unsafe-inline' is required for the dynamically added notification styles.
        # connect-src * allows the contact form to connect to any API endpoint.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src *;";

        # CV PDF with fallback logic
        location = /assets/cv.pdf {
            # Try external PDF first, then fallback to built-in template PDF
            try_files /assets/external/cv.pdf /assets/cv.pdf =404;
            
            # Set proper headers for PDF download
            add_header Content-Type application/pdf;
            add_header Content-Disposition 'attachment; filename="nahuel-santos-cv.pdf"';
            # The PDF changes on every release. A max-age here (and
            # Cloudflare's browser-cache TTL on top of it) kept a stale
            # PDF alive for hours after a deploy; revalidate instead.
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # CV Data JSON with fallback logic
        location = /cv.json {
            # Try external JSON first, then fallback to built-in JSON
            try_files /assets/external/cv.json /cv.json =404;
            
            # Set proper headers for JSON
            add_header Content-Type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Handle all JSON files with proper content-type
        location ~* \.json$ {
            add_header Content-Type application/json;
            add_header Cache-Control "public, max-age=300";
        }

        # Serve JS/CSS with revalidation rather than a fixed edge TTL. Cloudflare
        # caches by extension with its own 4h TTL, so it kept handing visitors a
        # months-old script.js after the fix had already been deployed to the
        # origin. The HTML is not cached by the edge (cf-cache-status: DYNAMIC),
        # so revalidating the entry points is enough for a deploy to be visible
        # immediately, with no cache purge.
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # The download route, deliberately extensionless. Cloudflare's default
        # cache keys off the file extension: a .pdf path is stored at the edge,
        # and a request that lands while Traefik is still refreshing its backends
        # (a few minutes after a recreate) gets Traefik's own 404 -- which has no
        # cache headers, so the edge keeps that 404 for its 4h TTL against that
        # exact URL, revision and all. An extensionless path is served with
        # cf-cache-status: DYNAMIC and never stored, so a transient 404 cannot
        # outlive the deploy. Content-Disposition names the saved file.
        location = /cv/download {
            try_files /assets/external/cv.pdf /assets/cv.pdf =404;
            default_type application/pdf;
            add_header Content-Disposition 'attachment; filename="nahuel-santos-cv.pdf"';
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Main location
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint for monitoring
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Metrics endpoint (optional, for nginx metrics)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
} 